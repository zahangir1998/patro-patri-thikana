<script>
const SUPABASE_URL="https://ekrablggrintqifpsdou.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_n7RIZqEDvlyMxng5l8H6aA_cDNXvka4";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const pages=[...document.querySelectorAll(".page")];
function showPage(id){pages.forEach(p=>p.classList.toggle("hidden",p.id!==id));document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===id));if(id==="favorites")renderFavorites();window.scrollTo({top:0,behavior:"smooth"})}
document.querySelectorAll("[data-page]").forEach(b=>b.addEventListener("click",()=>showPage(b.dataset.page)));
document.querySelectorAll("[data-open-page]").forEach(b=>b.addEventListener("click",()=>showPage(b.dataset.openPage)));
document.getElementById("year").textContent=new Date().getFullYear();
function getFavorites(){try{return JSON.parse(localStorage.getItem("patroPatriFavorites")||"[]")}catch{return[]}}
function setFavorites(ids){localStorage.setItem("patroPatriFavorites",JSON.stringify(ids))}
function toggleFavorite(id){let f=getFavorites();f=f.includes(id)?f.filter(x=>x!==id):[...f,id];setFavorites(f);renderProfiles();renderFavorites()}
function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function renderProfiles(){const box=document.getElementById("profiles");box.textContent="প্রোফাইল লোড হচ্ছে...";try{let q=supabaseClient.from("public_profiles").select("*").order("created_at",{ascending:false});const g=document.getElementById("gender").value;if(g!=="সব")q=q.eq("gender",g);const a=Number(document.getElementById("age").value);if(a>0)q=q.lte("age",a);const d=document.getElementById("district").value.trim();if(d)q=q.ilike("district","%"+d+"%");const {data,error}=await q.limit(100);if(error)throw error;if(!data?.length){box.innerHTML='<div class="panel">এখনো কোনো প্রোফাইল নেই। চাইলে রেজিস্ট্রেশন করুন।</div>';return}box.innerHTML=data.map(p=>`<article class="profile"><div class="avatar">${p.photo_url?`<img src="${escapeHtml(p.photo_url)}" alt="প্রোফাইল ছবি">`:"👤"}</div><div style="flex:1;min-width:0"><b>${escapeHtml(p.name)}</b><div>${escapeHtml(p.gender)} · ${escapeHtml(p.age)} বছর · ${escapeHtml(p.district)}</div><div class="muted">${escapeHtml(p.education||"")} ${escapeHtml(p.occupation||"")}</div><div class="muted">${escapeHtml(p.height||"")} ${escapeHtml(p.religion||"")} ${escapeHtml(p.marital_status||"")}</div><p>${escapeHtml(p.bio||"")}</p><button type="button" class="edit" data-fav="${escapeHtml(p.id)}">${getFavorites().includes(p.id)?"♥ পছন্দ থেকে সরান":"♡ পছন্দ করুন"}</button></div></article>`).join("");box.querySelectorAll("[data-fav]").forEach(b=>b.addEventListener("click",()=>toggleFavorite(b.dataset.fav)))}catch(e){console.error(e);box.innerHTML='<div class="panel">প্রোফাইল লোড হয়নি। Supabase সংযোগ ও public_profiles অনুমতি পরীক্ষা করুন।</div>'}}
